# Example simulation for integrating veins (http://veins.car2x.org/) with Simu5G
#
# Requirements:
#       You need to enable the feature "Simu5G Cars" for this simulation
#       (Project->Properties->OMNeT++->Project Features)
#
#       You need to import the "veins" project and its subproject
#       "veins_inet" in your workspace.
[General]
cmdenv-autoflush = true   # For logging, writes to stdout or file as the simulation runs
network = Highway # Use Highway network (Highway.ned). 10 Gbps bandwidth, more than enough and won't congest the network due to bandwidth (Evidence: queueLength:timeavg on upf.ppp[*].queue(the standard NIC output queue) is ~0 meaning the backlog only formed for a very small moment in the network, close to none, and also no dropped packets).

##########################################################
#            Simulation parameters                       #
##########################################################
debug-on-errors = false
print-undisposed = false # Reduce memory leak related logs, which are not useful and everything will be deleted in the end of the simulation anyways.

# In highway simulation, the last vehicle leaves at ~104s, roughly * 2 to guarantee that all vehicle would be able to finish.
sim-time-limit = 200s

**.routingRecorder.enabled = false # logging module for routing tables, not important as we have only 1 router

# Disable all vector and scalar recording globally, any logging required are explicitly enabled later.
**.vector-recording = false
**.scalar-recording = false

# Irrelevant but needed for simulation specs, using original settings from simu5g car simulation.
*.playgroundSizeX = 20000m
*.playgroundSizeY = 20000m
*.playgroundSizeZ = 50m

##########################################################
#            VeinsManager parameters                     #
##########################################################
*.veinsManager.host = "localhost"       # if traci-launchd runs on localhost
#*.veinsManager.host = "sumo"       # traci-launchd on different host/container

# Derived from Simu5G's NrCar to accommodate QUIC
# 5G NR carrier (2 GHz, 4.5 MHz / 25 RBs, numerology 0, FDD)
# Default parameters, it is a setting with lower capacity(~66 Mbps (the 4.5 MHz carrier's ceiling), smaller than the total data offered by the simulation per second(12 Mbps fan out to ~7 subscribers, that is ~84Mbps), to see the difference between performance of the protocols.
*.veinsManager.moduleType = "moqveinssim.nodes.QuicNrCar"
*.veinsManager.moduleName = "car"
# Urban road scenario
*.veinsManager.launchConfig = xmldoc("heterogeneous.launchd.xml")
*.veinsManager.updateInterval = 0.1s

##########################################################
#                      Mobility                          #
##########################################################
# Mobility provided by veins, connected to SUMO
*.car[*].mobility.typename = "VeinsInetMobility"


##########################################################
#          Mobile network specific parameters            #
##########################################################

# --- Channel model -------------------------------------------------------------------
# Declared explicitly rather than left to Simu5G's defaults, so the scenario is
# reproducible and citable. These values are the defaults already in effect (NrNicUe.ned /
# NrNicEnb.ned select NrChannelModel_3GPP38_901; LteRealisticChannelModel.ned enables
# shadowing and Jakes fading), so pinning them here changes no behaviour -- it only makes
# the model an explicit property of the experiment instead of an inherited default.
# The 3GPP TR 38.901 model provides LOS/NLOS path loss, log-normal shadowing and fading.

# Default model, also the standard and the most realistic one for 5G NR (TR 38.901)
**.nrChannelModelType = "NrChannelModel_3GPP38_901"
**.lteChannelModelType = "NrChannelModel_3GPP38_901"
**.nrChannelModel[0].scenario = "URBAN_MACROCELL"   # overridden to RURAL_MACROCELL on the highway
# Model how radio signal weakens and fluctuates from/to tower and car
# With path loss too: signal weakens as distance goes further from the tower
# Shadowing simulates the effect of blocking of the signal by obstacles like buildings. The model is using values drawn from a normal distribution correlated over distance.

# Difference between urban and rural macro cell scenario:
#               Urban 	                Highway
#Speed	        50 km/h	                120 km/h
#Propagation	Urban macro (more NLOS)	Rural macro (more LOS)
#Topology	    3×3 grid, cross traffic	Straight corridor, platoon
#Handovers	    Emergent, messy	        One clean, mid-run

# The need for two settings are for robustness and generalisation, to test if the hypothesis stands between environments.
**.nrChannelModel[0].shadowing = true
# Simulates the interferance between the different paths of the signal
**.nrChannelModel[0].fading = true
**.nrChannelModel[0].fadingType = "JAKES"
# Due to the random nature of this model, a 5-seed run is done per scenario and the average value is used to draw conclusions.

# --- Base station placement ----------------------------------------------------------
# gNodeB position previously came from INET's initFromDisplayString, i.e. the base stations
# sat wherever their icons were placed in Highway.ned. Pinned here to the same coordinates
# so the geometry is a declared parameter rather than an artifact of the display string.
*.gNodeB1.mobility.initialX = 156m
*.gNodeB1.mobility.initialY = 136m
*.gNodeB2.mobility.initialX = 391m
*.gNodeB2.mobility.initialY = 313m

# Number of Resource Blocks, limited to display network bottlenecks and help showing difference in performance
**.numBands = 25

# Transmission Power, simu5g default, 
**.ueTxPower = 26dBm
**.eNodeBTxPower = 46dBm

# Enable dynamic association of UEs (based on best SINR(Signal-to-Interference-plus-Noise Ratio))
# The base station's scheduler picks the modulation and coding scheme (MCS) based on the car's reported SINR.
*.car[*].cellularNic.nrPhy.dynamicCellAssociation = true
*.car[*].servingNodeId = 0     # ignored if dynamic association is enabled
*.car[*].nrServingNodeId = 1     # ignored if dynamic association is enabled

# eNodeB configuration, unique MAC ids per base station
**.gNodeB1.macCellId = 1
**.gNodeB1.macNodeId = 1
**.gNodeB2.macCellId = 2
**.gNodeB2.macNodeId = 2


# Enable handover
*.car[*].cellularNic.nrPhy.enableHandover = true
*.gNodeB*.cellularNic.phy.enableHandover = true
# Injects a brief mid-run stall that stresses each transport's recovery behaviour (QUIC's connection migration / loss recovery vs. TCP's RTO)
*.gNodeB*.cellularNic.phy.handoverLatency = 50ms
*.gNodeB*.cellInfo.broadcastMessageInterval = 1s # eNB will sends broadcast triggers every second

# X2 and SCTP configuration
# X2 is the standard 3GPP interface that directly connects two base stations to each other, used for Handover signalling and data forwarding
*.gNodeB*.numX2Apps = 1    # one x2App per peering eNodeB
*.gNodeB*.x2App[*].server.localPort = 5000 + ancestorIndex(1) # Server ports (x2App[0]=5000, x2App[1]=5001, ...)
*.gNodeB1.x2App[0].client.connectAddress = "gNodeB2%x2ppp0"
*.gNodeB2.x2App[0].client.connectAddress = "gNodeB1%x2ppp0"
**.sctp.nagleEnabled = false         # if true, transmission of small packets will be delayed on the X2
**.sctp.enableHeartbeats = false

##########################################################
#                   TCP/UDP Configurations                #
##########################################################

**.tcp.typename = "Tcp"
**.tcp.mss = 1460 # max segment size, the largest chunk of application data TCP will put in a single segment (packet), excluding headers.
**.tcp.advertisedWindow = 67108864 # 64MiB, a bare byte count (this int param takes no unit, unlike quic.initialMaxData). Default was 7504B (14*536), which starved the window and capped throughput at ~2.5Mbps, delivering only ~20% and producing noncredible latency. Only needs to exceed the ~400KB BDP; not literally 1GB, which exceeds the 65535<<14 max representable window under scaling.
**.tcp.tcpAlgorithmClass = "TcpReno" # QUIC uses newReno as congestion control algo, this match with quic
**.tcp.sackSupport = true # selective ack, prevents excessive retransmissions
**.tcp.windowScalingSupport = true   # 16-bit window caps at 65535B without this; needed for advertisedWindow > 64kB to match QUIC's 1GB initialMaxData


##########################################################
#                    QUIC Layer                           #
##########################################################
# FCS = Frame Check Sequence (the Ethernet/link-layer integrity field)
**.fcsMode = "declared"
# CRC = Cyclic Redundancy Check (the same idea at other layers — PPP, UDP/TCP checksums, etc.)
**.crcMode = "declared"
# "declared" means it is assumed that every checksum is correct, as simplification because we don't want the bit-level corruption induced packet loss and retransmissions to be a factor in performance evaluation, they don't say anything about protocol performance.

# QUIC flow control limits
**.quic.initialMaxData = 1GB
# Same limit, but per stream
**.quic.initialMaxStreamData = 1GB
# only the congestion controller and radio path bandwidth should be a limit, so these are set to 1GB to make it effectively unlimited

# reducing standalone ACK overhead on the air interface.
**.quic.bundleAckForNonAckElicitingPackets = true

# Disable D2D CQI reporting: not used in this simulation, and the Simu5G
# Binder does not remove departed UEs from ueList_, so getD2DCapability()
# asserts on stale node IDs when cars leave their routes.
*.gNodeB*.cellularNic.phy.enableD2DCqiReporting = false

# Same NewReno as the TCP's TcpReno as congestion control
*.car[*].quic.accurateIncreaseInNewRenoCongestionAvoidance = true
# The application-facing send buffer: QUIC accepts app data up to 100 KB queued, and signals the app to resume/throttle around the 80% low-water mark. Backpressure point for when the send path is overloaded and triggers the stream resets.
*.car[*].quic.sendQueueLimit = 100000B
*.car[*].quic.sendQueueLowWaterRatio = 0.8
*.server.quic.numReceivedAckElicitingsBeforeAck = 2

# ----------------------------------------------------------------------------- #
# Config "VoIP-Uplink"
#
[Config MOQ]

# Re-enable result recording for the MoQ app modules only (overrides the global
# disables in [General] by section precedence). The scalar enable uses both the .**.
# and .**.**. forms so it matches recordScalar()'s concatenated "<module>.<name>" key.
*.server.app[*].**.scalar-recording = true
*.server.app[*].**.**.scalar-recording = true
*.server.app[*].**.vector-recording = true
*.car[*].app[*].**.scalar-recording = true
*.car[*].app[*].**.**.scalar-recording = true
*.car[*].app[*].**.vector-recording = true


*.server.tcp.**.scalar-recording = true
*.server.tcp.**.**.scalar-recording = true
*.server.tcp.**.vector-recording = true
*.car[*].tcp.**.scalar-recording = true
*.car[*].tcp.**.**.scalar-recording = true
*.car[*].tcp.**.vector-recording = true


*.server.udp.**.scalar-recording = true
*.server.udp.**.**.scalar-recording = true
*.server.udp.**.vector-recording = true
*.car[*].udp.**.scalar-recording = true
*.car[*].udp.**.**.scalar-recording = true
*.car[*].udp.**.vector-recording = true

# Temp
*.server.ppp[*].queue.**.scalar-recording = true
*.server.ppp[*].queue.**.vector-recording = true
*.router.ppp[*].queue.**.scalar-recording = true
*.router.ppp[*].queue.**.vector-recording = true
*.upf.ppp[*].queue.**.scalar-recording    = true
*.upf.ppp[*].queue.**.vector-recording    = true

##########################################################
#                    App Layer                           #
# Server as relay, car as both pub and sub               #
# First car as pub, other cars as sub                    #
##########################################################
*.server.hasUdp = true
*.server.hasQuic = true
*.server.quic.typename = "Quic"
*.server.numApps = 1
*.server.app[0].typename = "moqveinssim.applications.moq.MoqRelayApp"
*.server.app[0].localAddress = ""
*.server.app[0].localPort = 9000
*.car[*].hasQuic = true
*.car[*].quic.typename = "Quic"
*.car[*].hasUdp = true
*.car[*].numApps = 1
*.car[0].app[0].typename = "moqveinssim.applications.moq.MoqPublisherApp"
*.car[0].app[0].localAddress = ""
*.car[0].app[0].localPort = 9001
*.car[0].app[0].connectAddress = "server"
*.car[0].app[0].connectPort = 9000
# Priorities follow MoQ semantics (lower number = higher priority): the small, latency-critical
# BBox track is high priority (0); the bulk PCloud track is low priority (1) and is shed first
# when the publisher's send path is overloaded.
# A Group is one sensor frame, emitted per sendInterval, and carries objectsPerGroup Objects on
# one subgroup stream (draft-14 2.2-2.3). PCloud is a LiDAR sweep sent as 8 independently usable
# 37.5KB segments rather than one 300KB blob: EMP (MobiCom'21) measures real uploads at 30-38KB
# per frame precisely so the edge "can leverage partial point cloud data", and ETSI TS 103 324
# segments a CPM into "independently interpretable" parts. Offered load is unchanged (300KB per
# 200ms). A reset then abandons the tail of a stale frame, leaving delivered segments usable.
# BBox stays at 1: it is the track we protect, and a reset discards the whole subgroup, so
# batching it would multiply its loss (at a 64kB window a group of 10 lost 291 of 411 BBox
# objects as collateral of 40 resets; a group of 1 loses none).
*.car[0].app[0].tracks = [{trackName: "BBox",packetSize: 50B, sendInterval: 0.1s, priority: 0, objectsPerGroup: 1},{trackName: "PCloud",packetSize: 37500B,sendInterval: 0.2s,priority: 1, objectsPerGroup: 8}]
*.car[1..].app[0].typename = "moqveinssim.applications.moq.MoqSubscriberApp"
*.car[1..].app[0].localAddress = ""
*.car[1..].app[0].localPort = 9002
*.car[1..].app[0].connectAddress = "server"
*.car[1..].app[0].connectPort = 9000
*.car[1..].app[0].tracks = [{trackName: "BBox", trackNamespace: "car[0]", startObjectId: 0, subscriberPriority: 0, deadline: 0.1s },{trackName: "PCloud", trackNamespace: "car[0]", startObjectId: 0, subscriberPriority: 1, deadline: 0.5s }]

# ----------------------------------------------------------------------------- #
# Same MoQ architecture over TCP / UDP instead of QUIC, for transport comparison.
# Only the app "protocol" parameter changes; the apps run TCP/UDP execution branches.
# ----------------------------------------------------------------------------- #
[Config MOQ_TCP]
extends = MOQ
*.server.hasTcp = true
*.car[*].hasTcp = true
*.server.app[*].protocol = "tcp"
*.car[*].app[*].protocol = "tcp"

[Config MOQ_UDP]
extends = MOQ
*.server.app[*].protocol = "udp"
*.car[*].app[*].protocol = "udp"

# Bounded-window MoQ: shrink QUIC's flow-control window so backpressure reaches the application
# send buffer (where deadline-based shedding can act). Without this, QUIC's 1GB window lets it
# hold seconds of data downstream (in QUIC/radio) where the app cannot drop it. This is the
# RELIABLE baseline (no shedding) for a fair comparison against MOQ_Partial.
[Config MOQ_SW]
extends = MOQ
**.quic.initialMaxData = 2MB
**.quic.initialMaxStreamData = 1MB

# MoQ partial reliability: same bounded window, but drop objects older than their per-track
# delivery timeout (MoQ OBJECT_DELIVERY_TIMEOUT) at the publisher and relay instead of sending
# stale data. Expect lower delivered latency / deadline-miss at the cost of intentional loss,
# with the high-priority BBox track protected and the bulk PCloud track shed first.
[Config MOQ_Partial]
extends = MOQ_SW
*.car[0].app[0].tracks = [{trackName: "BBox",packetSize: 50B, sendInterval: 0.1s, priority: 0, objectDeliveryTimeout: 0.2s, objectsPerGroup: 1},{trackName: "PCloud",packetSize: 37500B,sendInterval: 0.2s,priority: 1, objectDeliveryTimeout: 1.0s, objectsPerGroup: 8}]

# ----------------------------------------------------------------------------- #
# Offered-load sweep. The relay fans every PCloud object out to ~7 subscribers, so downlink demand
# is ~7 x (packetSize x 8 / 0.2s): 14 Mbps at 50KB up to 84 Mbps at 300KB, against a cell that
# delivers ~66 Mbps. The sweep therefore crosses from under- to over-subscribed, which is the point:
# at 300KB (the original setting) the network is saturated permanently, every track misses its
# deadline, and partial reliability has nothing to protect. Sweeping shows where it starts to pay.
#
# Run Sweep_SW (reliable) and Sweep_Partial (deadline shedding) and plot BBox deadlineMissRatio
# against offered load.
# ----------------------------------------------------------------------------- #
[Config Sweep_SW]
extends = MOQ_SW
# Five seeds per load point: radio fading, handover timing and SUMO spawn order vary enough between
# runs that a single replication produced a visibly non-monotonic deadline-miss curve.
repeat = 5
seed-set = ${repetition}
*.car[0].app[0].tracks = [{trackName: "BBox",packetSize: 50B, sendInterval: 0.1s, priority: 0},{trackName: "PCloud",packetSize: ${pcloud=50000,100000,150000,200000,250000,300000}B,sendInterval: 0.2s,priority: 1}]

[Config Sweep_Partial]
extends = MOQ_SW
repeat = 5
seed-set = ${repetition}
*.car[0].app[0].tracks = [{trackName: "BBox",packetSize: 50B, sendInterval: 0.1s, priority: 0, objectDeliveryTimeout: 0.2s},{trackName: "PCloud",packetSize: ${pcloud=50000,100000,150000,200000,250000,300000}B,sendInterval: 0.2s,priority: 1, objectDeliveryTimeout: 1.0s}]

# ============================================================================= #
# SCENARIO: HIGHWAY
#
# The scenario used by the configs above is a 3x3 SUMO grid with 200m edges and a 50 km/h
# speed limit -- an URBAN scenario, despite the network being named Highway. This section
# adds a genuine highway: a straight 3 km, 3-lane corridor at 120 km/h, with the two gNodeBs
# spaced along it so a traversing vehicle performs exactly one handover mid-run.
#
# This is a scenario MIXIN: it sets only mobility/topology/propagation keys, and shares no
# keys with the MoQ configs above, so it composes with any of them via multiple inheritance
# (e.g. "extends = MOQ_Partial, Highway"). The urban configs are untouched.
# ============================================================================= #
[Config Highway]
*.veinsManager.launchConfig = xmldoc("highway.launchd.xml")

# gNodeBs at 1/4 and 3/4 of the 3 km corridor, 100m off the carriageway. A vehicle at
# 120 km/h is in gNodeB1's cell for ~45s, then hands over to gNodeB2 for the rest.
*.gNodeB1.mobility.initialX = 750m
*.gNodeB1.mobility.initialY = 100m
*.gNodeB2.mobility.initialX = 2250m
*.gNodeB2.mobility.initialY = 100m

# TR 38.901 rural macrocell is the appropriate propagation scenario for an open highway
# corridor; the urban grid keeps URBAN_MACROCELL (set in [General]).
**.nrChannelModel[0].scenario = "RURAL_MACROCELL"

# Highway configs, one per transport / reliability mode, mirroring the urban set above.
[Config MOQ_HW]
extends = MOQ, Highway

[Config MOQ_TCP_HW]
extends = MOQ_TCP, Highway

[Config MOQ_UDP_HW]
extends = MOQ_UDP, Highway

[Config MOQ_SW_HW]
extends = MOQ_SW, Highway

[Config MOQ_Partial_HW]
extends = MOQ_Partial, Highway

# ============================================================================= #
# LOAD SCALING: MULTIPLE PUBLISHERS
#
# Every config above has a single publisher (car[0]), which is a thin basis for a claim about
# V2X in general. Here cars 0-2 all publish their own BBox + PCloud tracks (3x the offered
# uplink load, and each of the 5 remaining subscribers pulls all 3 publishers' tracks), which
# asks the scaling question: as offered load grows past capacity, does MoQ's delivery-timeout
# shedding still protect the safety-critical BBox track, or does everything collapse together?
#
# The relay already routes purely on trackAlias (namespace/name) and allocates a data stream
# per (subscriber, track), so no code change is needed -- only configuration.
# ============================================================================= #
[Config MOQ_Partial_MultiPub]
extends = MOQ_Partial

*.car[0..2].app[0].typename = "moqveinssim.applications.moq.MoqPublisherApp"
*.car[0..2].app[0].localAddress = ""
*.car[0..2].app[0].localPort = 9001
*.car[0..2].app[0].connectAddress = "server"
*.car[0..2].app[0].connectPort = 9000
*.car[0..2].app[0].tracks = [{trackName: "BBox",packetSize: 50B, sendInterval: 0.1s, priority: 0, objectDeliveryTimeout: 0.2s, objectsPerGroup: 1},{trackName: "PCloud",packetSize: 37500B,sendInterval: 0.2s,priority: 1, objectDeliveryTimeout: 1.0s, objectsPerGroup: 8}]

*.car[3..].app[0].typename = "moqveinssim.applications.moq.MoqSubscriberApp"
*.car[3..].app[0].localAddress = ""
*.car[3..].app[0].localPort = 9002
*.car[3..].app[0].connectAddress = "server"
*.car[3..].app[0].connectPort = 9000
*.car[3..].app[0].tracks = [{trackName: "BBox", trackNamespace: "car[0]", startObjectId: 0, subscriberPriority: 0, deadline: 0.1s},{trackName: "PCloud", trackNamespace: "car[0]", startObjectId: 0, subscriberPriority: 1, deadline: 0.5s},{trackName: "BBox", trackNamespace: "car[1]", startObjectId: 0, subscriberPriority: 0, deadline: 0.1s},{trackName: "PCloud", trackNamespace: "car[1]", startObjectId: 0, subscriberPriority: 1, deadline: 0.5s},{trackName: "BBox", trackNamespace: "car[2]", startObjectId: 0, subscriberPriority: 0, deadline: 0.1s},{trackName: "PCloud", trackNamespace: "car[2]", startObjectId: 0, subscriberPriority: 1, deadline: 0.5s}]

[Config MOQ_Partial_MultiPub_HW]
extends = MOQ_Partial_MultiPub, Highway

# ============================================================================= #
# BUFFERBLOAT SWEEP (MoQ draft-14 section 3.6.1)
#
# Measurement showed BBox's end-to-end latency is NOT dominated by the application: of its
# ~631ms mean, only ~67ms is the publisher's app send buffer and ~44ms the relay. The remaining
# ~520ms sits in QUIC's send queue and the RAN -- bytes already committed to the transport,
# which MoQ priority and delivery-timeout shedding cannot touch. BBox's max latency (1.55s)
# tracks the 2MB connection flow-control window at the ~12 Mbps this link achieves (~1.3s of
# standing queue). This is exactly the bufferbloat the MoQ draft warns about in section 3.6.1.
#
# So sweep the transport's buffer depth toward the bandwidth-delay product
# (~12 Mbps x ~50ms RTT ~= 75kB) and see whether the latency-critical track recovers. If it
# does, MoQ's priority mechanism was never the binding constraint -- queue depth was.
#
# sendQueueLimit (app->QUIC admission) is scaled with the window: at 100kB it alone is ~67ms of
# buffering at 12 Mbps, comparable to BBox's whole 100ms deadline, and once bytes are in that
# queue the app can no longer shed them.
# ============================================================================= #
[Config MOQ_Partial_Window]
extends = MOQ_Partial
**.quic.initialMaxData = ${win=2MB, 1MB, 512kB, 256kB, 128kB, 64kB}
**.quic.initialMaxStreamData = ${win}
*.car[*].quic.sendQueueLimit = ${sq=100000B, 100000B, 65536B, 32768B, 16384B, 16384B ! win}

# Reliable baseline under the same sweep, to show whether delivery-timeout shedding still adds
# anything once the transport queue is shallow (or whether a shallow queue alone is sufficient).
[Config MOQ_SW_Window]
extends = MOQ_SW
**.quic.initialMaxData = ${win=2MB, 1MB, 512kB, 256kB, 128kB, 64kB}
**.quic.initialMaxStreamData = ${win}
*.car[*].quic.sendQueueLimit = ${sq=100000B, 100000B, 65536B, 32768B, 16384B, 16384B ! win}

# ============================================================================= #
# MOQ SEND ORDER IN THE TRANSPORT (draft-14 section 7.2 + RFC 9000 section 2.3)
#
# QUIC defines no priority mechanism: RFC 9000 section 2.3 says "QUIC does not provide a
# mechanism for exchanging prioritization information. Instead, it relies on receiving priority
# information from the application", and that an implementation SHOULD offer an API for it.
# INET's QUIC only shipped a round-robin scheduler, so BBox and PCloud streams were served
# equally and MoQ's publisher priority never reached the wire -- priority existed only in our
# app-level send buffer, and was powerless over bytes already handed to QUIC.
#
# We added a PriorityScheduler to the INET fork (strict priority, round-robin within a priority)
# plus a per-send priority on QuicSocket, and the MoQ apps now pass each object's publisher
# priority down with it (control stream reserved at priority 0, per section 7.2).
#
# The question this sweep answers: with MoQ send order actually enforced in the transport, can
# the safety-critical track be protected at a LARGER flow-control window -- i.e. without having
# to throttle the connection so hard that the bulk track is annihilated?
# ============================================================================= #
[Config MOQ_Partial_Prio_Window]
extends = MOQ_Partial_Window
**.quic.streamScheduler = "Priority"


# ============================================================================= #
# MQTT v5.0 COMPARISON (RQ2)
#
# Same scenario, same workload, same offered load and burst shape as the MoQ configs; only the
# application protocol changes. Topics map onto tracks ("car[0]/BBox", "car[0]/PCloud").
#
# Two structural limits of MQTT are visible here and are findings in their own right:
#  * No per-message priority. Both topics share one connection, as a real MQTT deployment would,
#    so BBox queues behind PCloud -- the head-of-line blocking MoQ's subgroup-per-stream model
#    avoids. There is no MQTT mechanism to prefer one topic over another.
#  * Message Expiry Interval is a whole number of SECONDS (v5.0 3.3.2.3.3), so it cannot express
#    BBox's 100ms or PCloud's 500ms deadline. 1s is the smallest value the protocol permits.
#    It also only applies before onward delivery starts: once the broker begins sending, MQTT has
#    no way to abandon a stale message (no counterpart to MoQ's RESET_STREAM).
# ============================================================================= #
[Config MQTT_TCP]
extends = MOQ

# MQTT has no sender-side shedding and no backpressure signal to the application: a client hands
# every message to the transport and lets it buffer, which is exactly what it does over TCP. A
# tight QUIC send-queue limit would therefore not model MQTT -- INET's QUIC silently discards
# writes once its queue is full, so a bounded queue turns MQTT's buffering into invisible loss.
#
# The buffer must therefore be sized for the WHOLE SESSION, not for the bandwidth-delay product:
# because nothing is ever dropped, the backlog grows for as long as the publisher is offering more
# than the link carries. At ~12 Mbps offered the highway publisher (~90s on the road) tenders
# ~135MB, so a 100MB buffer overflowed and QUIC began discarding writes. That is a real property
# of MQTT and not a modelling artifact: with no way to shed, its memory requirement scales with
# session length x excess offered load. 1GB is enough for these runs.
*.car[*].quic.sendQueueLimit = 1GB
*.server.quic.sendQueueLimit = 1GB

*.server.hasTcp = true
*.car[*].hasTcp = true

*.server.numApps = 1
*.server.app[0].typename = "moqveinssim.applications.mqtt.MqttBrokerApp"
*.server.app[0].protocol = "tcp"
*.server.app[0].localPort = 9100
*.server.app[0].qos = ${qos=0}

*.car[0].app[0].typename = "moqveinssim.applications.mqtt.MqttPublisherApp"
*.car[0].app[0].protocol = "tcp"
*.car[0].app[0].localPort = 9101
*.car[0].app[0].connectAddress = "server"
*.car[0].app[0].connectPort = 9100
*.car[0].app[0].qos = ${qos}
# messageExpiryInterval is in seconds: 1s is the minimum MQTT can express, against MoQ's 0.2s/1.0s.
*.car[0].app[0].tracks = [{trackName: "BBox", packetSize: 50B, sendInterval: 0.1s, objectsPerGroup: 1, messageExpiryInterval: 1},{trackName: "PCloud", packetSize: 37500B, sendInterval: 0.2s, objectsPerGroup: 8, messageExpiryInterval: 1}]

*.car[1..].app[0].typename = "moqveinssim.applications.mqtt.MqttSubscriberApp"
*.car[1..].app[0].protocol = "tcp"
*.car[1..].app[0].localPort = 9102
*.car[1..].app[0].connectAddress = "server"
*.car[1..].app[0].connectPort = 9100
*.car[1..].app[0].qos = ${qos}
*.car[1..].app[0].tracks = [{trackName: "BBox", trackNamespace: "car[0]", deadline: 0.1s},{trackName: "PCloud", trackNamespace: "car[0]", deadline: 0.5s}]

# MQTT over QUIC. Not standardised; the accepted approach carries the MQTT byte stream over a
# single QUIC stream in place of TCP, which is what this does.
[Config MQTT_QUIC]
extends = MQTT_TCP
*.server.app[*].protocol = "quic"
*.car[*].app[*].protocol = "quic"

# MQTT on the highway scenario, so the protocol comparison can be run in both scenarios.
[Config MQTT_TCP_HW]
extends = MQTT_TCP, Highway

[Config MQTT_QUIC_HW]
extends = MQTT_QUIC, Highway

# ============================================================================= #
# BOUNDED-WINDOW OPERATING POINT (the configuration the window sweep identified)
#
# The QUIC flow-control window and send-queue are sized near the bandwidth-delay product
# (~12 Mbps x ~50ms RTT ~= 75kB) rather than left deep. This is what buys the safety track its
# deadline -- see findings/moq-operating-envelope.md. Kept as named configs rather than
# command-line overrides so the runs carry a distinct configname and can be told apart in the
# analysis tool.
# ============================================================================= #
[Config MOQ_Partial_BDP]
extends = MOQ_Partial
**.quic.initialMaxData = 128kB
**.quic.initialMaxStreamData = 128kB
*.car[*].quic.sendQueueLimit = 16384B

[Config MOQ_SW_BDP]
extends = MOQ_SW
**.quic.initialMaxData = 128kB
**.quic.initialMaxStreamData = 128kB
*.car[*].quic.sendQueueLimit = 16384B

[Config MOQ_Partial_BDP_HW]
extends = MOQ_Partial_BDP, Highway

[Config MOQ_SW_BDP_HW]
extends = MOQ_SW_BDP, Highway

# ============================================================================= #
# PUBLISHER-COUNT SWEEP AT CONSTANT OFFERED LOAD
#
# The MOQ_Partial_MultiPub run showed the safety-critical BBox track collapses when 3
# publishers each send at the full rate -- but that changed TWO variables at once: total
# offered load (x2.7) AND the number of senders. This sweep isolates the second: it holds
# total load constant and varies ONLY the publisher count, to answer "does splitting the
# same load across more senders degrade BBox, and why?".
#
# Design (fixed 8-car population, urban):
#  * Subscribers are ALWAYS cars 4-7 (4 subscribers), so their routes/mobility/handover are
#    identical across every N. Cars not publishing sit idle (numApps=0), keeping the vehicle
#    population -- and thus the radio environment -- constant.
#  * Publishers are cars 0..N-1. Each subscriber pulls every publisher's BBox+PCloud.
#  * Total load is held constant by scaling each publisher's PCloud object down as 64000/N B:
#    N publishers x (64000/N x 8 / 0.2s) = 2.56 MB/s per subscriber for every N, i.e. an
#    aggregate ~82 Mbps ~= 1.24x the ~66 Mbps cell (real contention; N=1 is the protected
#    reference point). BBox is left identical per publisher (50B/0.1s) -- negligible bytes even
#    x4 -- so the ONLY thing that changes with N is the number of streams multiplexed onto each
#    subscriber's single downlink QUIC connection: 2N.
#
# Hypothesis: under QUIC's default round-robin scheduler, BBox's share of each connection falls
# as ~1/(2N), so at constant load its latency should climb with N purely from stream dilution.
# The _Prio variants below re-run each point with the transport PriorityScheduler enabled; if
# priority flattens the N-dependence, the MultiPub collapse was "priority not enforced in the
# transport", not a fundamental session-scope wall.
# ============================================================================= #
[Config PubScale_Base]
extends = MOQ_SW
# BDP-sized flow-control window, NOT MOQ_SW's 2MB. At the 2.56 MB/s (~20.5 Mbps) per-subscriber
# rate below, one BDP ~= 20.5 Mbps x ~50ms RTT ~= 128 kB, i.e. ~50ms of standing queue -- under
# BBox's 100ms deadline. A 2MB window here is ~780ms of bufferbloat and drowns BBox even at N=1
# (measured: 2.6% on-time), which would mask the publisher-count effect this sweep is isolating.
# This is the same operating point as MOQ_Partial_BDP, so BBox is protected at N=1 and any
# degradation at higher N is attributable to fan-in, not window size.
**.quic.initialMaxData = 128kB
**.quic.initialMaxStreamData = 128kB
*.car[*].quic.sendQueueLimit = 16384B
# Publisher role for cars 0-3 (per-N track lists and idle overrides set below); subscriber role
# fixed on cars 4-7. Derived-section entries take precedence over the base MOQ assignments.
*.car[0..3].app[0].typename = "moqveinssim.applications.moq.MoqPublisherApp"
*.car[0..3].app[0].localAddress = ""
*.car[0..3].app[0].localPort = 9001
*.car[0..3].app[0].connectAddress = "server"
*.car[0..3].app[0].connectPort = 9000
*.car[4..7].app[0].typename = "moqveinssim.applications.moq.MoqSubscriberApp"
*.car[4..7].app[0].localAddress = ""
*.car[4..7].app[0].localPort = 9002
*.car[4..7].app[0].connectAddress = "server"
*.car[4..7].app[0].connectPort = 9000

[Config PubScale_N1]
extends = PubScale_Base
*.car[1..3].numApps = 0
*.car[0].app[0].tracks = [{trackName: "BBox",packetSize: 50B, sendInterval: 0.1s, priority: 0, objectDeliveryTimeout: 0.2s, objectsPerGroup: 1},{trackName: "PCloud",packetSize: 64000B,sendInterval: 0.2s,priority: 1, objectDeliveryTimeout: 1.0s, objectsPerGroup: 8}]
*.car[4..7].app[0].tracks = [{trackName: "BBox", trackNamespace: "car[0]", startObjectId: 0, subscriberPriority: 0, deadline: 0.1s},{trackName: "PCloud", trackNamespace: "car[0]", startObjectId: 0, subscriberPriority: 1, deadline: 0.5s}]

[Config PubScale_N2]
extends = PubScale_Base
*.car[2..3].numApps = 0
*.car[0..1].app[0].tracks = [{trackName: "BBox",packetSize: 50B, sendInterval: 0.1s, priority: 0, objectDeliveryTimeout: 0.2s, objectsPerGroup: 1},{trackName: "PCloud",packetSize: 32000B,sendInterval: 0.2s,priority: 1, objectDeliveryTimeout: 1.0s, objectsPerGroup: 8}]
*.car[4..7].app[0].tracks = [{trackName: "BBox", trackNamespace: "car[0]", startObjectId: 0, subscriberPriority: 0, deadline: 0.1s},{trackName: "PCloud", trackNamespace: "car[0]", startObjectId: 0, subscriberPriority: 1, deadline: 0.5s},{trackName: "BBox", trackNamespace: "car[1]", startObjectId: 0, subscriberPriority: 0, deadline: 0.1s},{trackName: "PCloud", trackNamespace: "car[1]", startObjectId: 0, subscriberPriority: 1, deadline: 0.5s}]

[Config PubScale_N3]
extends = PubScale_Base
*.car[3].numApps = 0
*.car[0..2].app[0].tracks = [{trackName: "BBox",packetSize: 50B, sendInterval: 0.1s, priority: 0, objectDeliveryTimeout: 0.2s, objectsPerGroup: 1},{trackName: "PCloud",packetSize: 21333B,sendInterval: 0.2s,priority: 1, objectDeliveryTimeout: 1.0s, objectsPerGroup: 8}]
*.car[4..7].app[0].tracks = [{trackName: "BBox", trackNamespace: "car[0]", startObjectId: 0, subscriberPriority: 0, deadline: 0.1s},{trackName: "PCloud", trackNamespace: "car[0]", startObjectId: 0, subscriberPriority: 1, deadline: 0.5s},{trackName: "BBox", trackNamespace: "car[1]", startObjectId: 0, subscriberPriority: 0, deadline: 0.1s},{trackName: "PCloud", trackNamespace: "car[1]", startObjectId: 0, subscriberPriority: 1, deadline: 0.5s},{trackName: "BBox", trackNamespace: "car[2]", startObjectId: 0, subscriberPriority: 0, deadline: 0.1s},{trackName: "PCloud", trackNamespace: "car[2]", startObjectId: 0, subscriberPriority: 1, deadline: 0.5s}]

[Config PubScale_N4]
extends = PubScale_Base
*.car[0..3].app[0].tracks = [{trackName: "BBox",packetSize: 50B, sendInterval: 0.1s, priority: 0, objectDeliveryTimeout: 0.2s, objectsPerGroup: 1},{trackName: "PCloud",packetSize: 16000B,sendInterval: 0.2s,priority: 1, objectDeliveryTimeout: 1.0s, objectsPerGroup: 8}]
*.car[4..7].app[0].tracks = [{trackName: "BBox", trackNamespace: "car[0]", startObjectId: 0, subscriberPriority: 0, deadline: 0.1s},{trackName: "PCloud", trackNamespace: "car[0]", startObjectId: 0, subscriberPriority: 1, deadline: 0.5s},{trackName: "BBox", trackNamespace: "car[1]", startObjectId: 0, subscriberPriority: 0, deadline: 0.1s},{trackName: "PCloud", trackNamespace: "car[1]", startObjectId: 0, subscriberPriority: 1, deadline: 0.5s},{trackName: "BBox", trackNamespace: "car[2]", startObjectId: 0, subscriberPriority: 0, deadline: 0.1s},{trackName: "PCloud", trackNamespace: "car[2]", startObjectId: 0, subscriberPriority: 1, deadline: 0.5s},{trackName: "BBox", trackNamespace: "car[3]", startObjectId: 0, subscriberPriority: 0, deadline: 0.1s},{trackName: "PCloud", trackNamespace: "car[3]", startObjectId: 0, subscriberPriority: 1, deadline: 0.5s}]

# Priority-scheduler variants (experiment 2): identical load, transport priority enforced.
[Config PubScale_N1_Prio]
extends = PubScale_N1
**.quic.streamScheduler = "Priority"

[Config PubScale_N2_Prio]
extends = PubScale_N2
**.quic.streamScheduler = "Priority"

[Config PubScale_N3_Prio]
extends = PubScale_N3
**.quic.streamScheduler = "Priority"

[Config PubScale_N4_Prio]

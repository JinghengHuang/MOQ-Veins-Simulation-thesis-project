# Example simulation for integrating veins (http://veins.car2x.org/) with Simu5G
#
# Requirements:
#       You need to enable the feature "Simu5G Cars" for this simulation
#       (Project->Properties->OMNeT++->Project Features)
#
#       You need to import the "veins" project and its subproject
#       "veins_inet" in your workspace.
[General]
cmdenv-autoflush = true
network = Highway

##########################################################
#            Simulation parameters                       #
##########################################################
debug-on-errors = false
print-undisposed = false

# The urban fleet (8 vehicles, last departing at 35s, ~46s mean trip) has cleared the road
# by ~95s; the remainder of the old 1000s limit simulated an empty network. The highway
# scenario raises this (see [Config Highway]).
sim-time-limit = 200s

**.routingRecorder.enabled = false

# Record output ONLY for the MoQ app modules (publisher/relay/subscriber). Disable
# all scalar/vector recording globally here; the app modules are re-enabled in
# [Config MOQ], which overrides [General] by section precedence. statistic-recording
# is left at its default because disabling it removes signal listeners that simu5g
# modules (e.g. NrPhy) require, which crashes the run.
**.vector-recording = false
**.scalar-recording = false

*.playgroundSizeX = 20000m
*.playgroundSizeY = 20000m
*.playgroundSizeZ = 50m

##########################################################
#            VeinsManager parameters                     #
##########################################################
*.veinsManager.host = "localhost"       # if traci-launchd runs on localhost
#*.veinsManager.host = "sumo"       # traci-launchd on different host/container
*.veinsManager.moduleType = "moqveinssim.nodes.QuicNrCar"
*.veinsManager.moduleName = "car"
*.veinsManager.launchConfig = xmldoc("heterogeneous.launchd.xml")
*.veinsManager.updateInterval = 0.1s

##########################################################
#                      Mobility                          #
##########################################################
*.car[*].mobility.typename = "VeinsInetMobility"


##########################################################
#          Mobile network specific parameters            #
##########################################################

# --- Channel model -------------------------------------------------------------------
# Declared explicitly rather than left to Simu5G's defaults, so the scenario is
# reproducible and citable. These values are the defaults already in effect (NrNicUe.ned /
# NrNicEnb.ned select NrChannelModel_3GPP38_901; LteRealisticChannelModel.ned enables
# shadowing and Jakes fading), so pinning them here changes no behaviour -- it only makes
# the model an explicit property of the experiment instead of an inherited default.
# The 3GPP TR 38.901 model provides LOS/NLOS path loss, log-normal shadowing and fading.
**.nrChannelModelType = "NrChannelModel_3GPP38_901"
**.lteChannelModelType = "NrChannelModel_3GPP38_901"
**.nrChannelModel[0].scenario = "URBAN_MACROCELL"   # overridden to RURAL_MACROCELL on the highway
**.nrChannelModel[0].shadowing = true
**.nrChannelModel[0].fading = true
**.nrChannelModel[0].fadingType = "JAKES"

# --- Base station placement ----------------------------------------------------------
# gNodeB position previously came from INET's initFromDisplayString, i.e. the base stations
# sat wherever their icons were placed in Highway.ned. Pinned here to the same coordinates
# so the geometry is a declared parameter rather than an artifact of the display string.
*.gNodeB1.mobility.initialX = 156m
*.gNodeB1.mobility.initialY = 136m
*.gNodeB2.mobility.initialX = 391m
*.gNodeB2.mobility.initialY = 313m

# Number of Resource Blocks
**.numBands = 25

# Transmission Power
**.ueTxPower = 26dBm
**.eNodeBTxPower = 46dBm

# Enable dynamic association of UEs (based on best SINR)
*.car[*].cellularNic.nrPhy.dynamicCellAssociation = true
*.car[*].servingNodeId = 0     # ignored if dynamic association is enabled
*.car[*].nrServingNodeId = 1     # ignored if dynamic association is enabled

# eNodeB configuration
**.gNodeB1.macCellId = 1
**.gNodeB1.macNodeId = 1
**.gNodeB2.macCellId = 2
**.gNodeB2.macNodeId = 2


# Enable handover
*.car[*].cellularNic.nrPhy.enableHandover = true
*.gNodeB*.cellularNic.phy.enableHandover = true
*.gNodeB*.cellularNic.phy.handoverLatency = 50ms
*.gNodeB*.cellInfo.broadcastMessageInterval = 1s # eNB will sends broadcast triggers every second

# X2 and SCTP configuration
*.gNodeB*.numX2Apps = 1    # one x2App per peering eNodeB
*.gNodeB*.x2App[*].server.localPort = 5000 + ancestorIndex(1) # Server ports (x2App[0]=5000, x2App[1]=5001, ...)
*.gNodeB1.x2App[0].client.connectAddress = "gNodeB2%x2ppp0"
*.gNodeB2.x2App[0].client.connectAddress = "gNodeB1%x2ppp0"
**.sctp.nagleEnabled = false         # if true, transmission of small packets will be delayed on the X2
**.sctp.enableHeartbeats = false

##########################################################
#                    QUIC Layer                           #
##########################################################
**.fcsMode = "declared"
**.crcMode = "declared"

**.quic.initialMaxData = 1GB
**.quic.initialMaxStreamData = 1GB
**.quic.bundleAckForNonAckElicitingPackets = true

# Disable D2D CQI reporting: not used in this simulation, and the Simu5G
# Binder does not remove departed UEs from ueList_, so getD2DCapability()
# asserts on stale node IDs when cars leave their routes.
*.gNodeB*.cellularNic.phy.enableD2DCqiReporting = false
*.car[*].quic.accurateIncreaseInNewRenoCongestionAvoidance = true
*.car[*].quic.sendQueueLimit = 100000B
*.car[*].quic.sendQueueLowWaterRatio = 0.8
*.server.quic.numReceivedAckElicitingsBeforeAck = 2

# ----------------------------------------------------------------------------- #
# Config "VoIP-Uplink"
#
[Config MOQ]

# Re-enable result recording for the MoQ app modules only (overrides the global
# disables in [General] by section precedence). The scalar enable uses both the .**.
# and .**.**. forms so it matches recordScalar()'s concatenated "<module>.<name>" key.
*.server.app[*].**.scalar-recording = true
*.server.app[*].**.**.scalar-recording = true
*.server.app[*].**.vector-recording = true
*.car[*].app[*].**.scalar-recording = true
*.car[*].app[*].**.**.scalar-recording = true
*.car[*].app[*].**.vector-recording = true

##########################################################
#                    App Layer                           #
# Server as relay, car as both pub and sub               #
# First car as pub, other cars as sub                    #
##########################################################
*.server.hasUdp = true
*.server.hasQuic = true
*.server.quic.typename = "Quic"
*.server.numApps = 1
*.server.app[0].typename = "moqveinssim.applications.moq.MoqRelayApp"
*.server.app[0].localAddress = ""
*.server.app[0].localPort = 9000
*.car[*].hasQuic = true
*.car[*].quic.typename = "Quic"
*.car[*].hasUdp = true
*.car[*].numApps = 1
*.car[0].app[0].typename = "moqveinssim.applications.moq.MoqPublisherApp"
*.car[0].app[0].localAddress = ""
*.car[0].app[0].localPort = 9001
*.car[0].app[0].connectAddress = "server"
*.car[0].app[0].connectPort = 9000
# Priorities follow MoQ semantics (lower number = higher priority): the small, latency-critical
# BBox track is high priority (0); the bulk PCloud track is low priority (1) and is shed first
# when the publisher's send path is overloaded.
# objectsPerGroup sets the MoQ Group/Subgroup size (draft-14 2.2-2.3): a Subgroup is carried on
# exactly one QUIC stream, so this is also the stream granularity, and the granularity at which
# a stream reset abandons data. PCloud uses 1 -- each point cloud is an independent random-access
# frame, and is the object worth abandoning when stale. BBox batches 10 objects (1s of data) per
# stream: at 50B/object a stream each would be pure overhead, and BBox is the track we protect,
# so it is essentially never reset anyway.
*.car[0].app[0].tracks = [{trackName: "BBox",packetSize: 50B, sendInterval: 0.1s, priority: 0, objectsPerGroup: 10},{trackName: "PCloud",packetSize: 300000B,sendInterval: 0.2s,priority: 1, objectsPerGroup: 1}]
*.car[1..].app[0].typename = "moqveinssim.applications.moq.MoqSubscriberApp"
*.car[1..].app[0].localAddress = ""
*.car[1..].app[0].localPort = 9002
*.car[1..].app[0].connectAddress = "server"
*.car[1..].app[0].connectPort = 9000
*.car[1..].app[0].tracks = [{trackName: "BBox", trackNamespace: "car[0]", startObjectId: 0, subscriberPriority: 0, deadline: 0.1s },{trackName: "PCloud", trackNamespace: "car[0]", startObjectId: 0, subscriberPriority: 1, deadline: 0.5s }]

# ----------------------------------------------------------------------------- #
# Same MoQ architecture over TCP / UDP instead of QUIC, for transport comparison.
# Only the app "protocol" parameter changes; the apps run TCP/UDP execution branches.
# ----------------------------------------------------------------------------- #
[Config MOQ_TCP]
extends = MOQ
*.server.hasTcp = true
*.car[*].hasTcp = true
*.server.app[*].protocol = "tcp"
*.car[*].app[*].protocol = "tcp"

[Config MOQ_UDP]
extends = MOQ
*.server.app[*].protocol = "udp"
*.car[*].app[*].protocol = "udp"

# Bounded-window MoQ: shrink QUIC's flow-control window so backpressure reaches the application
# send buffer (where deadline-based shedding can act). Without this, QUIC's 1GB window lets it
# hold seconds of data downstream (in QUIC/radio) where the app cannot drop it. This is the
# RELIABLE baseline (no shedding) for a fair comparison against MOQ_Partial.
[Config MOQ_SW]
extends = MOQ
**.quic.initialMaxData = 2MB
**.quic.initialMaxStreamData = 1MB

# MoQ partial reliability: same bounded window, but drop objects older than their per-track
# delivery timeout (MoQ OBJECT_DELIVERY_TIMEOUT) at the publisher and relay instead of sending
# stale data. Expect lower delivered latency / deadline-miss at the cost of intentional loss,
# with the high-priority BBox track protected and the bulk PCloud track shed first.
[Config MOQ_Partial]
extends = MOQ_SW
*.car[0].app[0].tracks = [{trackName: "BBox",packetSize: 50B, sendInterval: 0.1s, priority: 0, objectDeliveryTimeout: 0.2s, objectsPerGroup: 10},{trackName: "PCloud",packetSize: 300000B,sendInterval: 0.2s,priority: 1, objectDeliveryTimeout: 1.0s, objectsPerGroup: 1}]

# ----------------------------------------------------------------------------- #
# Offered-load sweep. The relay fans every PCloud object out to ~7 subscribers, so downlink demand
# is ~7 x (packetSize x 8 / 0.2s): 14 Mbps at 50KB up to 84 Mbps at 300KB, against a cell that
# delivers ~66 Mbps. The sweep therefore crosses from under- to over-subscribed, which is the point:
# at 300KB (the original setting) the network is saturated permanently, every track misses its
# deadline, and partial reliability has nothing to protect. Sweeping shows where it starts to pay.
#
# Run Sweep_SW (reliable) and Sweep_Partial (deadline shedding) and plot BBox deadlineMissRatio
# against offered load.
# ----------------------------------------------------------------------------- #
[Config Sweep_SW]
extends = MOQ_SW
# Five seeds per load point: radio fading, handover timing and SUMO spawn order vary enough between
# runs that a single replication produced a visibly non-monotonic deadline-miss curve.
repeat = 5
seed-set = ${repetition}
*.car[0].app[0].tracks = [{trackName: "BBox",packetSize: 50B, sendInterval: 0.1s, priority: 0},{trackName: "PCloud",packetSize: ${pcloud=50000,100000,150000,200000,250000,300000}B,sendInterval: 0.2s,priority: 1}]

[Config Sweep_Partial]
extends = MOQ_SW
repeat = 5
seed-set = ${repetition}
*.car[0].app[0].tracks = [{trackName: "BBox",packetSize: 50B, sendInterval: 0.1s, priority: 0, objectDeliveryTimeout: 0.2s},{trackName: "PCloud",packetSize: ${pcloud=50000,100000,150000,200000,250000,300000}B,sendInterval: 0.2s,priority: 1, objectDeliveryTimeout: 1.0s}]

# ============================================================================= #
# SCENARIO: HIGHWAY
#
# The scenario used by the configs above is a 3x3 SUMO grid with 200m edges and a 50 km/h
# speed limit -- an URBAN scenario, despite the network being named Highway. This section
# adds a genuine highway: a straight 3 km, 3-lane corridor at 120 km/h, with the two gNodeBs
# spaced along it so a traversing vehicle performs exactly one handover mid-run.
#
# This is a scenario MIXIN: it sets only mobility/topology/propagation keys, and shares no
# keys with the MoQ configs above, so it composes with any of them via multiple inheritance
# (e.g. "extends = MOQ_Partial, Highway"). The urban configs are untouched.
# ============================================================================= #
[Config Highway]
*.veinsManager.launchConfig = xmldoc("highway.launchd.xml")

# gNodeBs at 1/4 and 3/4 of the 3 km corridor, 100m off the carriageway. A vehicle at
# 120 km/h is in gNodeB1's cell for ~45s, then hands over to gNodeB2 for the rest.
*.gNodeB1.mobility.initialX = 750m
*.gNodeB1.mobility.initialY = 100m
*.gNodeB2.mobility.initialX = 2250m
*.gNodeB2.mobility.initialY = 100m

# TR 38.901 rural macrocell is the appropriate propagation scenario for an open highway
# corridor; the urban grid keeps URBAN_MACROCELL (set in [General]).
**.nrChannelModel[0].scenario = "RURAL_MACROCELL"

# Highway configs, one per transport / reliability mode, mirroring the urban set above.
[Config MOQ_HW]
extends = MOQ, Highway

[Config MOQ_TCP_HW]
extends = MOQ_TCP, Highway

[Config MOQ_UDP_HW]
extends = MOQ_UDP, Highway

[Config MOQ_SW_HW]
extends = MOQ_SW, Highway

[Config MOQ_Partial_HW]
extends = MOQ_Partial, Highway

# ============================================================================= #
# LOAD SCALING: MULTIPLE PUBLISHERS
#
# Every config above has a single publisher (car[0]), which is a thin basis for a claim about
# V2X in general. Here cars 0-2 all publish their own BBox + PCloud tracks (3x the offered
# uplink load, and each of the 5 remaining subscribers pulls all 3 publishers' tracks), which
# asks the scaling question: as offered load grows past capacity, does MoQ's delivery-timeout
# shedding still protect the safety-critical BBox track, or does everything collapse together?
#
# The relay already routes purely on trackAlias (namespace/name) and allocates a data stream
# per (subscriber, track), so no code change is needed -- only configuration.
# ============================================================================= #
[Config MOQ_Partial_MultiPub]
extends = MOQ_Partial

*.car[0..2].app[0].typename = "moqveinssim.applications.moq.MoqPublisherApp"
*.car[0..2].app[0].localAddress = ""
*.car[0..2].app[0].localPort = 9001
*.car[0..2].app[0].connectAddress = "server"
*.car[0..2].app[0].connectPort = 9000
*.car[0..2].app[0].tracks = [{trackName: "BBox",packetSize: 50B, sendInterval: 0.1s, priority: 0, objectDeliveryTimeout: 0.2s, objectsPerGroup: 10},{trackName: "PCloud",packetSize: 300000B,sendInterval: 0.2s,priority: 1, objectDeliveryTimeout: 1.0s, objectsPerGroup: 1}]

*.car[3..].app[0].typename = "moqveinssim.applications.moq.MoqSubscriberApp"
*.car[3..].app[0].localAddress = ""
*.car[3..].app[0].localPort = 9002
*.car[3..].app[0].connectAddress = "server"
*.car[3..].app[0].connectPort = 9000
*.car[3..].app[0].tracks = [{trackName: "BBox", trackNamespace: "car[0]", startObjectId: 0, subscriberPriority: 0, deadline: 0.1s},{trackName: "PCloud", trackNamespace: "car[0]", startObjectId: 0, subscriberPriority: 1, deadline: 0.5s},{trackName: "BBox", trackNamespace: "car[1]", startObjectId: 0, subscriberPriority: 0, deadline: 0.1s},{trackName: "PCloud", trackNamespace: "car[1]", startObjectId: 0, subscriberPriority: 1, deadline: 0.5s},{trackName: "BBox", trackNamespace: "car[2]", startObjectId: 0, subscriberPriority: 0, deadline: 0.1s},{trackName: "PCloud", trackNamespace: "car[2]", startObjectId: 0, subscriberPriority: 1, deadline: 0.5s}]

[Config MOQ_Partial_MultiPub_HW]
extends = MOQ_Partial_MultiPub, Highway

# ============================================================================= #
# BUFFERBLOAT SWEEP (MoQ draft-14 section 3.6.1)
#
# Measurement showed BBox's end-to-end latency is NOT dominated by the application: of its
# ~631ms mean, only ~67ms is the publisher's app send buffer and ~44ms the relay. The remaining
# ~520ms sits in QUIC's send queue and the RAN -- bytes already committed to the transport,
# which MoQ priority and delivery-timeout shedding cannot touch. BBox's max latency (1.55s)
# tracks the 2MB connection flow-control window at the ~12 Mbps this link achieves (~1.3s of
# standing queue). This is exactly the bufferbloat the MoQ draft warns about in section 3.6.1.
#
# So sweep the transport's buffer depth toward the bandwidth-delay product
# (~12 Mbps x ~50ms RTT ~= 75kB) and see whether the latency-critical track recovers. If it
# does, MoQ's priority mechanism was never the binding constraint -- queue depth was.
#
# sendQueueLimit (app->QUIC admission) is scaled with the window: at 100kB it alone is ~67ms of
# buffering at 12 Mbps, comparable to BBox's whole 100ms deadline, and once bytes are in that
# queue the app can no longer shed them.
# ============================================================================= #
[Config MOQ_Partial_Window]
extends = MOQ_Partial
**.quic.initialMaxData = ${win=2MB, 1MB, 512kB, 256kB, 128kB, 64kB}
**.quic.initialMaxStreamData = ${win}
*.car[*].quic.sendQueueLimit = ${sq=100000B, 100000B, 65536B, 32768B, 16384B, 16384B ! win}

# Reliable baseline under the same sweep, to show whether delivery-timeout shedding still adds
# anything once the transport queue is shallow (or whether a shallow queue alone is sufficient).
[Config MOQ_SW_Window]
extends = MOQ_SW
**.quic.initialMaxData = ${win=2MB, 1MB, 512kB, 256kB, 128kB, 64kB}
**.quic.initialMaxStreamData = ${win}
*.car[*].quic.sendQueueLimit = ${sq=100000B, 100000B, 65536B, 32768B, 16384B, 16384B ! win}

# ============================================================================= #
# MOQ SEND ORDER IN THE TRANSPORT (draft-14 section 7.2 + RFC 9000 section 2.3)
#
# QUIC defines no priority mechanism: RFC 9000 section 2.3 says "QUIC does not provide a
# mechanism for exchanging prioritization information. Instead, it relies on receiving priority
# information from the application", and that an implementation SHOULD offer an API for it.
# INET's QUIC only shipped a round-robin scheduler, so BBox and PCloud streams were served
# equally and MoQ's publisher priority never reached the wire -- priority existed only in our
# app-level send buffer, and was powerless over bytes already handed to QUIC.
#
# We added a PriorityScheduler to the INET fork (strict priority, round-robin within a priority)
# plus a per-send priority on QuicSocket, and the MoQ apps now pass each object's publisher
# priority down with it (control stream reserved at priority 0, per section 7.2).
#
# The question this sweep answers: with MoQ send order actually enforced in the transport, can
# the safety-critical track be protected at a LARGER flow-control window -- i.e. without having
# to throttle the connection so hard that the bulk track is annihilated?
# ============================================================================= #
[Config MOQ_Partial_Prio_Window]
extends = MOQ_Partial_Window
**.quic.streamScheduler = "Priority"

